<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cancionerobenja/">
  <link rel="icon" href="images/logo-schoenstatt-png.png" type="image/png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JT9R1R0NHX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JT9R1R0NHX');
  </script>
  <meta charset="utf-8">
  <title>Programa de misa - Cancionero Católico</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/cancionero.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
</head>

<body>
  <div id="nav-placeholder"></div>
  <script>
    $(function(){
      $("#nav-placeholder").load("navbar.html");
    });
  </script> 

  <div class="navigation-buttons d-flex justify-content-between p-3">
    <button id="anterior" class="btn btn-outline-primary">⬅ Anterior</button>
    <button id="siguiente" class="btn btn-outline-primary">Siguiente ➡</button>
  </div>

  <div id="programa-container"></div>

<script>
  const programa = JSON.parse(localStorage.getItem('programaMisa'));
  if (!programa || programa.length === 0) {
    alert('No hay un programa de misa guardado.');
    window.location.href = 'crear-programa.html';
  }

  let currentIndex = 0;

  async function cargarCancion(ruta) {
    try {
      const response = await fetch(ruta);
      if (!response.ok) throw new Error('Error al cargar la canción');
      
      const contenido = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(contenido, 'text/html');
      
      const container = document.getElementById('programa-container');
      container.innerHTML = doc.querySelector('body').innerHTML;

      container.querySelectorAll('#nav-placeholder, .nav-canciones, #super-menu-container, #fav-overlay, #fav-modal, script').forEach(el => el.remove());

      setTimeout(() => { aplicarTonoYCapo(programa[currentIndex]); }, 100);

    } catch (error) {
      document.getElementById('programa-container').innerHTML = '<p class="text-center mt-5">Error al cargar la canción.</p>';
    }
  }

  function aplicarTonoYCapo(item) {
    const pre = document.querySelector('#letra');
    if (!pre) return;
    const $pre = $(pre);

    if (!$pre.prev('.transpose-keys').length && typeof $ !== 'undefined' && typeof $.fn.transpose === 'function') {
      $pre.transpose();
    }

    if (item.tono) {
      const claveObjetivo = item.tono.replace(/m$/i, '');
      const $link = $pre.prev('.transpose-keys').find('a').filter(function () {
        return $(this).text().toUpperCase() === claveObjetivo.toUpperCase();
      }).first();
      if ($link.length) $link.trigger('click');
    }

    const keysDiv = $pre.prev('.transpose-keys');
    let capoDiv = $pre.prev('.capo-selector-div');
    
    if (capoDiv.length === 0) {
        let opciones = "";
        for(let i = 0; i <= 12; i++) {
            let texto = i === 0 ? "Sin Capo" : "Capo " + i;
            opciones += `<option value="${i}">${texto}</option>`;
        }
        // ESTÉTICA AJUSTADA A FOTO 2
        const capoHTML = `
            <div class="capo-selector-div" style="text-align:center; margin-top: 10px; margin-bottom: 25px;">
                <label style="font-size:15px; margin-right: 5px;">🎸 Capo: </label>
                <select class="form-select form-select-sm d-inline-block capo-dropdown-repertorio" style="width: auto; cursor:pointer;">
                    ${opciones}
                </select>
            </div>
        `;
        if(keysDiv.length > 0) {
            keysDiv.after(capoHTML);
        } else {
            $pre.before(capoHTML);
        }
        capoDiv = $pre.prev('.capo-selector-div');
    }

    const select = capoDiv.find('select');
    select.val(item.capo !== undefined ? item.capo : 0);

    select.off('change').on('change', function() {
        programa[currentIndex].capo = parseInt($(this).val());
        localStorage.setItem('programaMisa', JSON.stringify(programa));
    });
  }

  function mostrarCancion(index) {
    currentIndex = index;
    cargarCancion(programa[index].cancion);
    window.scrollTo(0, 0);
    document.getElementById('anterior').disabled = currentIndex === 0;
    document.getElementById('siguiente').disabled = currentIndex === programa.length - 1;
  }

  document.getElementById('anterior').onclick = () => { if (currentIndex > 0) mostrarCancion(currentIndex - 1); };
  document.getElementById('siguiente').onclick = () => { if (currentIndex < programa.length - 1) mostrarCancion(currentIndex + 1); };

  mostrarCancion(currentIndex);
</script>

<script src="scripts/cancionero.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
