<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cancionerobenja/">
 
 
 
  
 
  
  <link rel="icon" href="images/logo-schoenstatt-png.png" type="image/png">
  <meta charset="utf-8">
  <title>Programa Completo de Misa - Cancionero Católico</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" type="text/css" href="css/cancionero.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script src="scripts/cancionero.js"></script>
</head>

<body>
  <div id="nav-placeholder"></div>
  <script>
    $(function(){
      $("#nav-placeholder").load("navbar.html");
    });
  </script> 

  <div class="text-center mt-4 mb-2 no-print d-flex justify-content-center align-items-center gap-2 flex-wrap">
    <span id="nombre-repertorio-badge" class="badge rounded-pill border px-3 py-2" style="font-size: 14px; font-weight: 700; color: #2A9D8F !important; background: rgba(42, 157, 143, 0.08);">📁 Repertorio</span>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 fw-bold" onclick="window.print()" title="Imprimir o exportar como PDF">
      🖨️ Imprimir / Guardar PDF
    </button>
  </div>

  <div id="programa-completo-container" class="d-flex flex-column justify-content-center text-center mt-3"></div>

  <script>
    const nombreRepertorioActivo = (function() {
      try {
        return localStorage.getItem('programaMisaNombre') || '';
      } catch(e) { return ''; }
    })();
    if (nombreRepertorioActivo && document.getElementById('nombre-repertorio-badge')) {
      document.getElementById('nombre-repertorio-badge').textContent = '📁 ' + nombreRepertorioActivo;
    }

    const programa = JSON.parse(localStorage.getItem('programaMisa'));
    if (!programa) {
      alert('No hay un programa de misa guardado.');
      window.location.href = 'crear-programa.html';
    }

    const canciones = programa.map(item => item.cancion);

    const regexAcordeExacto = /^(\(?)(DO|RE|MI|FA|SOL|LA|SI)[b#]?(2|4|5|6|7|9|11|13|6\/9|6\(9\)|7\-5|7\-9|7\#5|7\#9|7\+5|7\+9|7b5|7b9|7sus2|7sus4|9sus4|add2|add4|add9|aug|°|dim|Ø|dim7|mb5|m7b5|m\/maj7|mMaj7|m6|m7|m9|m11|m13|m79|maj7|maj9|maj11|maj13|majb5|m|sus|sus2|sus4|\([0-9b\#\+\-\/]+\)|\+)*(\/(DO|RE|MI|FA|SOL|LA|SI)[b#]?)*(\)?)$/;
    const regexAuxAcorde = /^([-–—\/|()xX0-9:]+|intro:?|final:?|inter:?|puente:?|bis:?)$/i;

    // Función para determinar si una línea es realmente de acordes (y no una frase en mayúsculas con "LA", "MI" o "SI")
    function isChordLine(line) {
      const sinTags = line.replace(/<[^>]*>/g, ' ').trim();
      if (!sinTags) return false;
      const tokens = sinTags.split(/\s+/);
      let cantAcordes = 0;
      for (const tok of tokens) {
        if (regexAcordeExacto.test(tok)) {
          cantAcordes++;
        } else if (!regexAuxAcorde.test(tok)) {
          return false;
        }
      }
      return cantAcordes > 0;
    }

    // Función para procesar el contenido de la canción
    function procesarCancion(contenido) {
      const lines = contenido.split('\n');
      let output = '';
      for (let line of lines) {
        if (!isChordLine(line)) {
          output += `<span>${line}</span>\n`;
        } else {
          // Si la línea de acordes tenía etiquetas <b> o </b>, las conservamos para no romper la negrita del estribillo
          const tagsNegrita = (line.match(/<\/?b>/gi) || []).join('');
          if (tagsNegrita) output += tagsNegrita;
        }
      }
      return output;
    }

    async function cargarCancion(ruta) {
      try {
        const response = await fetch(ruta);
        if (!response.ok) {
          throw new Error('Error al cargar la canción');
        }
        const contenido = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(contenido, 'text/html');
        const preContent = doc.querySelector('pre').innerHTML;
        const title = doc.querySelector('title').innerText;

        const contenidoProcesado = procesarCancion(preContent);
        return `<h2>${title}</h2><pre class="lh-base">${contenidoProcesado}</pre>`;
      } catch (error) {
        console.error('Error:', error);
        return '<p>Error al cargar la canción. Inténtalo de nuevo más tarde.</p>';
      }
    }

    async function mostrarProgramaCompleto() {
      const programaContainer = document.getElementById('programa-completo-container');
      for (const cancion of canciones) {
        const contenidoCancion = await cargarCancion(cancion);
        const divCancion = document.createElement('div');
        divCancion.className = 'cancion-content align-self-lg-center';
        divCancion.innerHTML = contenidoCancion;
        programaContainer.appendChild(divCancion);
      }
    }

    mostrarProgramaCompleto().then(() => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('print') === '1' || urlParams.get('print') === 'true') {
        setTimeout(() => { window.print(); }, 500);
      }
    });
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
