<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cancionerobenja/">
 
 
 
  
 
  
  <link rel="icon" href="images/logo-schoenstatt-png.png" type="image/png">
  <meta charset="utf-8">
  <title>Programa Completo de Misa - Cancionero Católico</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" type="text/css" href="css/cancionero.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script src="scripts/cancionero.js"></script>
  <style>
    @media print {
      #nav-placeholder, nav, .navbar, .no-print,
      #super-menu-container, #menu-trigger, #menu-content,
      button, .btn {
        display: none !important;
      }

      .cancion-content {
        break-inside: auto !important;
        page-break-inside: auto !important;
        display: block !important;
        margin-bottom: 24px !important;
        padding-bottom: 16px !important;
      }

      .cancion-content h2 {
        break-after: avoid-page !important;
        break-after: avoid !important;
        page-break-after: avoid !important;
        margin-top: 14px !important;
        margin-bottom: 8px !important;
      }

      .cancion-content pre,
      pre.lh-base {
        display: block !important;
        break-before: avoid-page !important;
        break-before: avoid !important;
        page-break-before: avoid !important;
        break-inside: auto !important;
        page-break-inside: auto !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        height: auto !important;
        max-height: none !important;
        white-space: pre-wrap !important;
      }

      /* MODO 2 COLUMNAS EN IMPRESIÓN (OPCIÓN AHORRO DE PAPEL) */
      body.imprimir-2-columnas pre.lh-base,
      body.imprimir-2-columnas .cancion-content pre {
        column-count: 2 !important;
        column-gap: 24px !important;
        column-rule: 1px dashed #cccccc !important;
        font-size: 9.5pt !important;
        line-height: 1.35 !important;
      }

      .nota-inline-wrapper {
        background-color: #fef3c7 !important;
        border: 1px solid #f59e0b !important;
        border-left: 4px solid #d97706 !important;
        border-radius: 4pt !important;
        padding: 4pt 8pt !important;
        margin: 5pt 0 !important;
        font-size: 9.5pt !important;
        color: #78350f !important;
        white-space: normal !important;
        display: block !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .nota-inline-tag { font-weight: 800 !important; font-size: 8.5pt !important; text-transform: uppercase !important; color: #b45309 !important; }
      .nota-inline-cuerpo { font-weight: 500 !important; display: inline !important; }
    }
  </style>
</head>

<body>
  <div id="nav-placeholder"></div>
  <script>
    $(function(){
      $("#nav-placeholder").load("navbar.html");
    });
  </script> 

  <div class="text-center mt-4 mb-2 no-print d-flex justify-content-center align-items-center gap-3 flex-wrap">
    <span id="nombre-repertorio-badge" class="badge rounded-pill border px-3 py-2" style="font-size: 14px; font-weight: 700; color: #2A9D8F !important; background: rgba(42, 157, 143, 0.08);">📁 Repertorio</span>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 fw-bold" onclick="window.print()" title="Imprimir o exportar como PDF">
      🖨️ Imprimir / Guardar PDF
    </button>
    <div class="form-check form-switch d-inline-flex align-items-center gap-1 m-0">
      <input class="form-check-input" type="checkbox" id="toggle-2-columnas" style="cursor:pointer;" onchange="cambiarModoColumnas(this.checked)">
      <label class="form-check-label small fw-bold" for="toggle-2-columnas" style="cursor:pointer;" title="Al imprimir, organiza la letra en 2 columnas para ahorrar papel">📑 2 Columnas</label>
    </div>
  </div>

  <div id="programa-completo-container" class="d-flex flex-column justify-content-center text-center mt-3"></div>

  <script>
    const nombreRepertorioActivo = (function() {
      try {
        return localStorage.getItem('programaMisaNombre') || '';
      } catch(e) { return ''; }
    })();
    if (nombreRepertorioActivo && document.getElementById('nombre-repertorio-badge')) {
      document.getElementById('nombre-repertorio-badge').textContent = '📁 ' + nombreRepertorioActivo;
    }

    function cambiarModoColumnas(activo) {
      if (activo) {
        document.body.classList.add('imprimir-2-columnas');
        localStorage.setItem('cancionero_print_2cols', 'true');
      } else {
        document.body.classList.remove('imprimir-2-columnas');
        localStorage.setItem('cancionero_print_2cols', 'false');
      }
    }

    const urlParamsCols = new URLSearchParams(window.location.search);
    const prefCols = urlParamsCols.get('cols') === '2' || localStorage.getItem('cancionero_print_2cols') === 'true';
    if (prefCols) {
      document.body.classList.add('imprimir-2-columnas');
      const chk = document.getElementById('toggle-2-columnas');
      if (chk) chk.checked = true;
    }

    const programa = JSON.parse(localStorage.getItem('programaMisa'));
    if (!programa) {
      alert('No hay un programa de misa guardado.');
      window.location.href = 'crear-programa.html';
    }

    const canciones = programa.map(item => item.cancion);

    const regexAcordeExacto = /^(\(?)(DO|RE|MI|FA|SOL|LA|SI)[b#]?(2|4|5|6|7|9|11|13|6\/9|6\(9\)|7\-5|7\-9|7\#5|7\#9|7\+5|7\+9|7b5|7b9|7sus2|7sus4|9sus4|add2|add4|add9|aug|°|dim|Ø|dim7|mb5|m7b5|m\/maj7|mMaj7|m6|m7|m9|m11|m13|m79|maj7|maj9|maj11|maj13|majb5|m|sus|sus2|sus4|\([0-9b\#\+\-\/]+\)|\+)*(\/(DO|RE|MI|FA|SOL|LA|SI)[b#]?)*(\)?)$/;
    const regexAuxAcorde = /^([-–—\/|()xX0-9:]+|intro:?|final:?|inter:?|puente:?|bis:?)$/i;

    // Función para determinar si una línea es realmente de acordes (y no una frase en mayúsculas con "LA", "MI" o "SI")
    function isChordLine(line) {
      const sinTags = line.replace(/<[^>]*>/g, ' ').trim();
      if (!sinTags) return false;
      const tokens = sinTags.split(/\s+/);
      let cantAcordes = 0;
      for (const tok of tokens) {
        if (regexAcordeExacto.test(tok)) {
          cantAcordes++;
        } else if (!regexAuxAcorde.test(tok)) {
          return false;
        }
      }
      return cantAcordes > 0;
    }

    function escaparHTML(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function removerEmojis(str) {
      if (!str) return "";
      return str.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/gu, "");
    }

    // Función para procesar el contenido de la canción
    function procesarCancion(contenido, arrayNotas) {
      const lines = contenido.split('\n');
      let output = '';
      const notas = Array.isArray(arrayNotas) ? arrayNotas : [];

      for (let i = 0; i < lines.length; i++) {
        // Notas para esta línea (o notas generales en la línea 0)
        const notasDeLinea = notas.filter(n => {
          const idx = (n.lineIndex !== undefined && n.lineIndex !== null) ? n.lineIndex : -1;
          return (idx === i) || (i === 0 && idx < 0);
        });

        for (const n of notasDeLinea) {
          output += `<span class="nota-inline-wrapper"><b class="nota-inline-tag">📌 NOTA:</b> <span class="nota-inline-cuerpo">${escaparHTML(n.texto)}</span></span>\n`;
        }

        const line = lines[i];
        if (!isChordLine(line)) {
          output += `<span>${line}</span>\n`;
        } else {
          // Si la línea de acordes tenía etiquetas <b> o </b>, las conservamos para no romper la negrita del estribillo
          const tagsNegrita = (line.match(/<\/?b>/gi) || []).join('');
          if (tagsNegrita) output += tagsNegrita;
        }
      }
      return output;
    }

    async function cargarCancion(item) {
      try {
        const ruta = typeof item === 'string' ? item : item.cancion;
        const response = await fetch(ruta);
        if (!response.ok) {
          throw new Error('Error al cargar la canción');
        }
        const contenido = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(contenido, 'text/html');
        const preContent = doc.querySelector('pre').innerHTML;
        const title = doc.querySelector('title').innerText;

        let notasGlobales = {};
        try { notasGlobales = JSON.parse(localStorage.getItem("cancionero_notas") || "{}"); } catch(e){}
        const claveNormal = (ruta || "").replace(/^\/?cancionerobenja\//, "").replace(/^\/+/, "");
        const notaItem = (item && item.nota !== undefined && item.nota !== "") ? item.nota : (notasGlobales[claveNormal] || notasGlobales[ruta] || notasGlobales["/" + claveNormal] || "");
        
        let arrayNotas = [];
        if (Array.isArray(notaItem)) {
          arrayNotas = notaItem;
        } else if (typeof notaItem === "string" && notaItem.trim()) {
          arrayNotas = [{ lineIndex: -1, texto: notaItem.trim() }];
        }

        const contenidoProcesado = procesarCancion(preContent, arrayNotas);
        return `<h2>${title}</h2><pre class="lh-base">${contenidoProcesado}</pre>`;
      } catch (error) {
        console.error('Error:', error);
        return '<p>Error al cargar la canción. Inténtalo de nuevo más tarde.</p>';
      }
    }

    async function mostrarProgramaCompleto() {
      const programaContainer = document.getElementById('programa-completo-container');
      for (const item of programa) {
        const contenidoCancion = await cargarCancion(item);
        const divCancion = document.createElement('div');
        divCancion.className = 'cancion-content align-self-lg-center';
        divCancion.innerHTML = contenidoCancion;
        programaContainer.appendChild(divCancion);
      }
    }

    mostrarProgramaCompleto().then(() => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('print') === '1' || urlParams.get('print') === 'true') {
        setTimeout(() => { window.print(); }, 500);
      }
    });
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
