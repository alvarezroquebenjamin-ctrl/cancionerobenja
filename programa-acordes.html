<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cancionerobenja/">
  <link rel="icon" href="images/logo-schoenstatt-png.png" type="image/png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YES9XTRYX6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YES9XTRYX6');
  </script>
  <meta charset="utf-8">
  <title>Lista de Canciones (Con Acordes)</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/cancionero.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <style>
  /* La caja que envuelve todo (acordes, capo y botones) */
  .cancion-en-lista {
    max-width: 500px !important; 
    margin: 0 auto !important; 
    display: block !important; 
  }

  /* Asegura que los botones y el capo ocupen todo el renglón y se centren */
  .transpose-keys, .capo-selector-div {
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    width: 100% !important;
    clear: both !important; /* Evita que nada se ponga a los costados */
  }

  /* LA MAGIA: Obliga a la letra a ir abajo y alinea todas las canciones igual */
  pre[id^="letra-lista"] {
    display: block !important; /* Fuerza a ir a un renglón nuevo (abajo del capo) */
    width: 100% !important; /* Todas las canciones ocupan el mismo ancho */
    text-align: left !important; /* El texto se alinea a la izquierda de la caja */
    white-space: pre-wrap !important; 
    padding: 0 10px !important;
    margin: 0 !important;
  }
</style>
</head>

<body>
  <div id="nav-placeholder"></div>
  <script>
    $(function(){
      $("#nav-placeholder").load("navbar.html");
    });
  </script> 

  <div id="programa-container" class="container" style="max-width: 700px; margin: 0 auto; padding-top: 20px;"></div>

<script>
  const programa = JSON.parse(localStorage.getItem('programaMisa'));
  if (!programa || programa.length === 0) {
    alert('No hay un programa de misa guardado.');
    window.location.href = 'crear-programa.html';
  }

  const container = document.getElementById('programa-container');

  async function cargarTodo() {
    for (let i = 0; i < programa.length; i++) {
      const item = programa[i];
      try {
        const response = await fetch(item.cancion);
        if (!response.ok) continue;
        
        const contenido = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(contenido, 'text/html');
        
        // Título de la canción, forzado al centro
        const tituloHTML = `<h3 class="mt-4 mb-3 text-center" style="color:#0A2846; font-weight:bold;">${item.nombre}</h3>`;
        
        const letraPre = doc.querySelector('#letra');
        
        if (letraPre) {
          letraPre.id = `letra-lista-${i}`;
          
          const divCancion = document.createElement('div');
          // LE QUITAMOS EL FLEXBOX A ESTE CONTENEDOR
          divCancion.className = 'cancion-en-lista mb-5 pb-5 border-bottom'; 
          
          // EL TRUCO ESTÁ ACÁ: Envolvemos la letra en un div centrado (`text-align: center`), y como el `<pre>` es `inline-block`, se va a centrar como si fuera una imagen, pero manteniendo su texto interno a la izquierda.
          divCancion.innerHTML = tituloHTML + `<div style="text-align: center; width: 100%;">${letraPre.outerHTML}</div>`;
          
          container.appendChild(divCancion);

          setTimeout(() => { aplicarTonoYCapo(item, i); }, 50);
        }
      } catch (error) {
        console.error(`Error al cargar ${item.cancion}:`, error);
      }
    }
  }

  function aplicarTonoYCapo(item, index) {
    const $pre = $(`#letra-lista-${index}`);
    if ($pre.length === 0) return;

    // Transponer la canción
    if (typeof $ !== 'undefined' && typeof $.fn.transpose === 'function') {
      $pre.transpose();
    }

    // Aplicar tono
    if (item.tono) {
      const claveObjetivo = item.tono.replace(/m$/i, '');
      const $link = $pre.prev('.transpose-keys').find('a').filter(function () {
        return $(this).text().toUpperCase() === claveObjetivo.toUpperCase();
      }).first();
      if ($link.length) $link.trigger('click');
    }

    // Dibujar Capo
    const keysDiv = $pre.prev('.transpose-keys');
    let capoDiv = $pre.prev('.capo-selector-div'); 
    
    if (capoDiv.length === 0) {
        let opciones = "";
        for(let i = 0; i <= 12; i++) {
            let texto = i === 0 ? "Sin Capo" : "Capo " + i;
            opciones += `<option value="${i}">${texto}</option>`;
        }
        
        const capoHTML = `
            <div class="capo-selector-div" style="text-align:center; margin-top: 10px; margin-bottom: 25px;">
                <label style="font-size:15px; margin-right: 5px;">🎸 Capo: </label>
                <select class="form-select form-select-sm d-inline-block capo-dropdown-repertorio" style="width: auto; cursor:pointer;" data-index="${index}">
                    ${opciones}
                </select>
            </div>
        `;
        
        if(keysDiv.length > 0) {
            keysDiv.after(capoHTML);
        } else {
            $pre.before(capoHTML);
        }
        capoDiv = $pre.prev('.capo-selector-div');
    }

    const select = capoDiv.find('select');
    select.val(item.capo !== undefined ? item.capo : 0);

    select.off('change').on('change', function() {
        const idx = $(this).data('index');
        programa[idx].capo = parseInt($(this).val());
        localStorage.setItem('programaMisa', JSON.stringify(programa));
    });
  }

  cargarTodo();
</script>

<script src="scripts/cancionero.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
