<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cancionerobenja/">
  <link rel="icon" href="images/logo-schoenstatt-png.png" type="image/png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JT9R1R0NHX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JT9R1R0NHX');
  </script>
  <meta charset="utf-8">
  <title>Lista de Canciones (Con Acordes)</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/cancionero.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script src="scripts/cancionero.js"></script>
  <style>
  /* La caja que envuelve todo (acordes, capo y botones) */
  .cancion-en-lista {
    width: 100% !important; 
    max-width: 800px !important;
    margin: 0 auto !important; 
    display: block !important; 
  }

  /* Asegura que los botones y el capo ocupen todo el renglón y se centren en pantalla */
  @media screen {
    .transpose-keys, .capo-selector-div {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 100% !important;
      flex-wrap: wrap !important; /* Para que los botones bajen de línea si no entran en el celu */
      clear: both !important; 
    }

    /* En pantalla: Centra la caja y permite que el texto adentro esté alineado a la izquierda */
    pre[id^="letra-lista"] {
      display: inline-block !important; /* Permite que el div padre lo centre como un bloque */
      width: auto !important; /* Se ajusta al ancho del texto más largo */
      max-width: 100% !important;
      text-align: left !important; /* El texto por dentro se alinea a la izquierda de la caja */
      white-space: pre-wrap !important; 
      padding: 0 10px !important;
      margin: 0 auto !important;
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
    }
  }

  /* AL IMPRIMIR / PDF: Ocultar botones de tonalidad, capo, menús flotantes; garantizar que título y letra queden juntos */
  @media print {
    .transpose-keys, .capo-selector-div,
    #super-menu-container, #menu-trigger, #menu-content,
    #nav-placeholder, nav, .no-print, button, .btn {
      display: none !important;
    }

    .cancion-en-lista {
      break-inside: auto !important;
      page-break-inside: auto !important;
      display: block !important;
      margin-bottom: 24px !important;
      padding-bottom: 16px !important;
    }

    .cancion-en-lista h3 {
      break-after: avoid-page !important;
      break-after: avoid !important;
      page-break-after: avoid !important;
      margin-top: 14px !important;
      margin-bottom: 8px !important;
    }

    .cancion-en-lista > div,
    pre[id^="letra-lista"] {
      display: block !important;
      break-before: avoid-page !important;
      break-before: avoid !important;
      page-break-before: avoid !important;
      break-inside: auto !important;
      page-break-inside: auto !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
      white-space: pre-wrap !important;
    }

    /* MODO 2 COLUMNAS EN IMPRESIÓN (OPCIÓN AHORRO DE PAPEL) */
    body.imprimir-2-columnas pre[id^="letra-lista"] {
      column-count: 2 !important;
      column-gap: 24px !important;
      column-rule: 1px dashed #cccccc !important;
      font-size: 9.5pt !important;
      line-height: 1.35 !important;
    }

    .nota-inline-wrapper {
      background-color: #fef3c7 !important;
      border: 1px solid #f59e0b !important;
      border-left: 4px solid #d97706 !important;
      border-radius: 4pt !important;
      padding: 4pt 8pt !important;
      margin: 5pt 0 !important;
      font-size: 9.5pt !important;
      color: #78350f !important;
      white-space: normal !important;
      display: block !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .nota-inline-tag { font-weight: 800 !important; font-size: 8.5pt !important; text-transform: uppercase !important; color: #b45309 !important; }
    .nota-inline-cuerpo { font-weight: 500 !important; display: inline !important; }
  }
  /* --- COLOR DE LOS TÍTULOS EN MODO OSCURO --- */
  body.modo-oscuro .cancion-en-lista h3 {
    color: #90caf9 !important; /* Este es un celeste clarito. Si lo preferís blanco puro, poné #ffffff */
  }
</style>
</head>

<body>
  <div id="nav-placeholder"></div>
  <script>
    $(function(){
      $("#nav-placeholder").load("navbar.html");
    });
  </script> 

  <div class="text-center my-3 no-print d-flex justify-content-center align-items-center gap-3 flex-wrap">
    <span id="nombre-repertorio-badge" class="badge rounded-pill border px-3 py-2" style="font-size: 14px; font-weight: 700; color: #2A9D8F !important; background: rgba(42, 157, 143, 0.08);">📁 Repertorio</span>
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 fw-bold" onclick="window.print()" title="Imprimir o exportar como PDF">
      🖨️ Imprimir / Guardar PDF
    </button>
    <div class="form-check form-switch d-inline-flex align-items-center gap-1 m-0">
      <input class="form-check-input" type="checkbox" id="toggle-2-columnas" style="cursor:pointer;" onchange="cambiarModoColumnas(this.checked)">
      <label class="form-check-label small fw-bold" for="toggle-2-columnas" style="cursor:pointer;" title="Al imprimir, organiza la letra en 2 columnas para ahorrar papel">📑 2 Columnas</label>
    </div>
  </div>

  <div id="programa-container" class="container" style="max-width: 800px; margin: 0 auto; padding-top: 10px;"></div>

<script>
  const nombreRepertorioActivo = (function() {
    try {
      return localStorage.getItem('programaMisaNombre') || '';
    } catch(e) { return ''; }
  })();
  if (nombreRepertorioActivo && document.getElementById('nombre-repertorio-badge')) {
    document.getElementById('nombre-repertorio-badge').textContent = '📁 ' + nombreRepertorioActivo;
  }

  function cambiarModoColumnas(activo) {
    if (activo) {
      document.body.classList.add('imprimir-2-columnas');
      localStorage.setItem('cancionero_print_2cols', 'true');
    } else {
      document.body.classList.remove('imprimir-2-columnas');
      localStorage.setItem('cancionero_print_2cols', 'false');
    }
  }

  // Comprobar parámetros de URL o preferencia guardada
  const urlParamsCols = new URLSearchParams(window.location.search);
  const prefCols = urlParamsCols.get('cols') === '2' || localStorage.getItem('cancionero_print_2cols') === 'true';
  if (prefCols) {
    document.body.classList.add('imprimir-2-columnas');
    const chk = document.getElementById('toggle-2-columnas');
    if (chk) chk.checked = true;
  }

  const programa = JSON.parse(localStorage.getItem('programaMisa'));
  if (!programa || programa.length === 0) {
    alert('No hay un programa de misa guardado.');
    window.location.href = 'crear-programa.html';
  }

  const container = document.getElementById('programa-container');

  function escaparHTML(str) {
    if (!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  async function cargarTodo() {
    for (let i = 0; i < programa.length; i++) {
      const item = programa[i];
      try {
        const response = await fetch(item.cancion);
        if (!response.ok) continue;
        
        const contenido = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(contenido, 'text/html');
        
        let notasGlobales = {};
        try { notasGlobales = JSON.parse(localStorage.getItem("cancionero_notas") || "{}"); } catch(e){}
        const claveNormal = (item.cancion || "").replace(/^\/?cancionerobenja\//, "").replace(/^\/+/, "");
        const notaRaw = (item.nota !== undefined && item.nota !== "") ? item.nota : (notasGlobales[claveNormal] || notasGlobales[item.cancion] || notasGlobales["/" + claveNormal] || "");
        
        let arrayNotas = [];
        if (Array.isArray(notaRaw)) {
          arrayNotas = notaRaw;
        } else if (typeof notaRaw === "string" && notaRaw.trim()) {
          arrayNotas = [{ lineIndex: -1, texto: notaRaw.trim() }];
        }

        // Título de la canción, forzado al centro
        const tituloHTML = `<h3 class="mt-4 mb-3 text-center" style="color:#0A2846; font-weight:bold;">${item.nombre}</h3>`;
        
        const letraPre = doc.querySelector('#letra') || doc.querySelector('.zona-letra') || doc.querySelector('pre');
        
        if (letraPre) {
          letraPre.id = `letra-lista-${i}`;
          letraPre.setAttribute('data-song-path', item.cancion);
          letraPre.setAttribute('data-index', i);
          if (!letraPre.getAttribute('data-key') && item.tono) {
            letraPre.setAttribute('data-key', item.tono);
          }

          const divCancion = document.createElement('div');
          divCancion.className = 'cancion-en-lista mb-5 pb-5 border-bottom'; 
          divCancion.setAttribute('data-song-path', item.cancion);
          
          // Envolvemos la letra en un div centrado
          divCancion.innerHTML = tituloHTML + `<div style="text-align: center; width: 100%;">${letraPre.outerHTML}</div>`;
          container.appendChild(divCancion);

          const $preEl = $(`#letra-lista-${i}`);
          $preEl.data('song-path', item.cancion);
          $preEl.attr('data-song-path', item.cancion);

          // 1. Aplicar transposición y tono PRIMERO sobre la letra limpia
          aplicarTonoYCapo(item, i);

          // 2. Insertar las notas DESPUÉS de aplicar el tono usando renderizarNotasCancion
          if (typeof window.renderizarNotasCancion === 'function') {
            window.renderizarNotasCancion(item.cancion, $preEl);
          } else if (arrayNotas.length > 0) {
            const rawLines = $preEl.html().split('\n');
            const newLines = [];
            for (let l = 0; l < rawLines.length; l++) {
              const notasDeLinea = arrayNotas.filter(n => {
                const idx = (n.lineIndex !== undefined && n.lineIndex !== null) ? n.lineIndex : -1;
                return (idx === l) || (l === 0 && idx < 0);
              });
              notasDeLinea.forEach(n => {
                newLines.push(`<span class="nota-inline-wrapper"><b class="nota-inline-tag">📌 NOTA:</b> <span class="nota-inline-cuerpo">${escaparHTML(n.texto)}</span></span>`);
              });
              newLines.push(rawLines[l]);
            }
            $preEl.html(newLines.join('\n'));
          }
        }
      } catch (error) {
        console.error(`Error al cargar ${item.cancion}:`, error);
      }
    }
  }

  function aplicarTonoYCapo(item, index) {
    const $pre = $(`#letra-lista-${index}`);
    if ($pre.length === 0) return;

    // Transponer la canción
    if (typeof $ !== 'undefined' && typeof $.fn.transpose === 'function') {
      $pre.transpose();
    }

    // Aplicar tono
    if (item.tono) {
      const equivalencias = { "REb": "DO#", "RE#": "MIb", "SOLb": "FA#", "LAb": "SOL#", "LA#": "SIb" };
      let claveObjetivo = item.tono.replace(/m$/i, '').trim();
      if (equivalencias[claveObjetivo]) claveObjetivo = equivalencias[claveObjetivo];
      let claveObjetivoAm = (typeof window.convertirAcordeLatinoAAmericano === 'function') ? window.convertirAcordeLatinoAAmericano(claveObjetivo) : claveObjetivo;
      const $link = $pre.prev('.transpose-keys').find('a').filter(function () {
        const t = $(this).text().toUpperCase();
        return t === claveObjetivo.toUpperCase() || t === claveObjetivoAm.toUpperCase();
      }).first();
      if ($link.length) $link.trigger('click');
    }

    // Dibujar Capo
    const keysDiv = $pre.prev('.transpose-keys');
    let capoDiv = $pre.prev('.capo-selector-div'); 
    
    if (capoDiv.length === 0) {
        let opciones = "";
        for(let i = 0; i <= 12; i++) {
            let texto = i === 0 ? "Sin Capo" : "Capo " + i;
            opciones += `<option value="${i}">${texto}</option>`;
        }
        
        const botonCifrado = `
            <button type="button" class="btn-toggle-cifrado" style="height:28px; padding:3px 10px; border-radius:99px; border:1px solid #2A9D8F; background:rgba(42,157,143,0.12); color:#2A9D8F; font-size:11.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:3px;" title="Cambiar sistema de acordes entre Latino (DO) y Americano (C)">
                🔤 Cifrado: <b class="lbl-cifrado-modo">${(localStorage.getItem("cancionero_sistema_cifrado") === "americano" ? "C" : "DO")}</b>
            </button>
        `;
        
        const capoHTML = `
            <div class="capo-selector-div" style="margin-top: 4px; margin-bottom: 16px;">
                <label style="font-size:12px; font-weight:700; margin-right:4px;">🎸 Capo: </label>
                <select class="form-select form-select-sm d-inline-block capo-dropdown-repertorio" style="width: auto; height:28px; padding:2px 24px 2px 8px; font-size:11.5px; font-weight:600; border-radius:99px; border:1px solid #2A9D8F; background-color:rgba(42,157,143,0.08); color:inherit; cursor:pointer;" data-index="${index}">
                    ${opciones}
                </select>
                ${botonCifrado}
            </div>
        `;
        
        if(keysDiv.length > 0) {
            keysDiv.after(capoHTML);
        } else {
            $pre.before(capoHTML);
        }
        capoDiv = $pre.prev('.capo-selector-div');
    }

    if (localStorage.getItem("cancionero_sistema_cifrado") === "americano" && typeof window.aplicarSistemaCifrado === 'function') {
      window.aplicarSistemaCifrado("americano", $pre);
    }

    const select = capoDiv.find('select');
    select.val(item.capo !== undefined ? item.capo : 0);

    select.off('change').on('change', function() {
        const idx = $(this).data('index');
        programa[idx].capo = parseInt($(this).val());
        localStorage.setItem('programaMisa', JSON.stringify(programa));
    });
  }

  cargarTodo().then(() => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('print') === '1' || urlParams.get('print') === 'true') {
      setTimeout(() => { window.print(); }, 700);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
